<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display property</title>
  <style>
    .box{
      height: 200px;
      width: 200px;
      margin: 10px;
      background-color: tomato;
      display: block;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1><div id="box1"class="box">box1</div></h1>
  <h1><div id="box2"class="box">box2</div></h1>
</body>
</html>
