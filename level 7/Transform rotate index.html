<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box{
      height: 100px;
      width: 100px;
      background-color: rgb(159, 215, 250);
      border: 2px black solid;
      margin: 30px;
      
      transform: rotate(90deg);

    
    }
    .box:hover{
      height: 100px;
      width: 100px;
      background-color: rgb(70, 232, 97);
    }
    .box:active{
      height: 100px;
      width: 100px;
      background-color: rgb(238, 17, 50);
    }
  </style>
</head>
<body>
  <h1><button class="box">rotate</button></h1>
</body>
</html>
