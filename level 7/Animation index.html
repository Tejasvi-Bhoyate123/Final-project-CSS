<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #box{
      height: 100px;
      width: 100px;
      background-color: aquamarine;
      border: 2px solid black;
      padding: 10px;
      margin: 25px;
     
      position: relative;

      animation-name : firtay;
      animation-duration: 2s;
      animation-timing-function: ease-in-out;
      animation-delay: 1s;

      animation-iteration-count: 2s;
      animation-direction: alternate-reverse;
    }
      @keyframes firtay {
        from{left: 10px;}
        to{left: 500px;}
        
      }
    #box1{
      height: 100px;
      width: 100px;
      background-color: aquamarine;
      border: 2px solid black;
      padding: 10px;
      margin: 25px;

      

      position: relative;

      animation-name: firtay;
      animation-duration: 2s;
      animation-timing-function: ease-in-out;
      animation-delay: 1s;

      animation-iteration-count: 2s;
      animation-direction: alternate-reverse;
    }
      @keyframes firtay {
        from{left: 10px;}
        to{left: 500px;}
        
      }

    }
   </style>
</head>
<body>
  <div id="box">Teju</div>
  <div id="box1">mahesh</div>
  
  
</body>
</html>
